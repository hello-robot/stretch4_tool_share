# Classes. The driver is this tool's servo; metadata supplies its unit conversions.
# Omitting py_module_name/py_class_name leaves the EndOfArm subsystem on EOA_Wrist_DW4_Tool_NIL,
# and omitting client_module_name/client_class_name leaves the joint on ToolJointClient.
driver_module_name: nyu_gripper_driver
driver_class_name: NyuGripper

metadata_module_name: nyu_gripper_metadata
metadata_class_name: NyuGripperMetadata

# Servo parameters that differ from SE4_eoa_tool_servo_DW4. Everything the baseline already
# states -- bus settings, motion profiles, stall detection, runstop behavior -- is inherited.
id: 25

# Tool Safety Limits
range_deg:
- 0
- 187
range_pad_deg:
- 0.0
- 10.0
eeprom_cfg:
  max_load_limit_pct: 20.0
  overload_safe: 15.0
  overload_thresh: 20.0
  enable_protection_overload: 1

# Servo homing configuration
homing_to_neg_limit: 1
homing_pwm: -80
homing_stall_pos_window_t: 60
flip_encoder_polarity: 1


