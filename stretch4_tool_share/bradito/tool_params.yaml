# Bradito -- a tendon-driven parallel gripper for Stretch 4 (mechanically the NYU gripper).
#
# A user tool's params are deep-merged onto the passive `eoa_wrist_dw4_tool_nil` baseline,
# so the three DexWrist v4 joints below are restated only to fix their order on the Feetech
# chain relative to the gripper.

# The EndOfArm subclass (end_of_arm.py) -- the `end_of_arm` subsystem itself.
py_module_name: end_of_arm
py_class_name: Bradito

# The ToolMetadata subclass (bradito_metadata.py). This tool is Path B (nonlinear): the
# fingertip aperture is the chord 2*L*sin(finger_angle), so urdf <-> command is an asin and
# no single linear scale describes it.
metadata_module_name: bradito_metadata
metadata_class_name: BraditoMetadata

# NOTE: client_module_name / client_class_name are deliberately NOT set. RobotClient reads
# those two keys as an EndOfArmClient subclass, while LinearToolMetadata reads the same two
# keys as the tool's joint client -- one key pair, two incompatible meanings. Setting them
# makes EndOfArmClient build itself as its own `.gripper` and recurse. The joint client is
# wired through BraditoMetadata.client_class instead, and RobotClient falls back to a
# generated `Bradito_Client` EndOfArmClient.

# URDF names, used for ROS JointState publishing, self-collision and the tool_info params.
tool_joints: ['brd_finger_left_joint', 'brd_finger_right_joint']
primary_joint: 'brd_finger_left_joint'
tool_links: ['brd_body_link', 'brd_finger_left_link', 'brd_finger_right_link']

# Arrival threshold in URDF units (rad); the ROS trajectory server uses it to decide when a
# gripper goal is complete. ~2.5% of the 0.703 rad finger travel.
position_tolerance: 0.018

use_group_sync_read: 0
use_group_sync_write: 0
retry_on_comm_failure: 1
baud: 1000000
i_feedforward_payload: 0.2
wrist: eoaw_dw4
tool: bradito

stow:
  arm: 0.0
  lift: 0.15
  wrist_pitch: 0.0
  wrist_roll: 0.0
  wrist_yaw: 3.14
  bradito: 0          # pct: stow closed

collision_mgmt:
  k_brake_distance:
    wrist_pitch: 0.25
    wrist_yaw: 0.25
    wrist_roll: 0.25
  collision_pairs:
    wrist_pitch_link_TO_base_link:
      link_pts: wrist_pitch_link
      link_cube: base_link
      detect_as: pts
    wrist_yaw_bottom_link_TO_base_link:
      link_pts: wrist_yaw_bottom_link
      link_cube: base_link
      detect_as: pts
  joints:
    lift:
    - motion_dir: neg
      collision_pair: wrist_pitch_link_TO_base_link
    - motion_dir: neg
      collision_pair: wrist_yaw_bottom_link_TO_base_link

devices:
  wrist_pitch:
    py_class_name: WristPitch
    py_module_name: stretch4_body.subsystem.end_of_arm.wrist_pitch
    device_params: SE4_wrist_pitch_DW4
  wrist_roll:
    py_class_name: WristRoll
    py_module_name: stretch4_body.subsystem.end_of_arm.wrist_roll
    device_params: SE4_wrist_roll_DW4
  wrist_yaw:
    py_class_name: WristYaw
    py_module_name: stretch4_body.subsystem.end_of_arm.wrist_yaw
    device_params: SE4_wrist_yaw_DW4
  # Keyed by the tool name, which makes this block both the servo's device entry and the
  # tool's own top-level params (robot_params['bradito']) after the merge -- that is where
  # ToolMetadata looks up range_deg, gripper_conversion and the motion profiles.
  bradito:
    py_class_name: BraditoGripper
    py_module_name: tool
    device_params: null
    gripper_conversion:
      finger_length_m: 0.11205    # straight fingertip radius from brd_finger_right_link.STL
      aperture_open_m: 0.145      # measured fingertip to fingertip, fully open
      aperture_closed_m: 0.0
    eeprom_cfg:
      temperature_limit: 72
      max_voltage_limit: 29
      min_voltage_limit: 11
      pid:
      - 32
      - 32
      - 0
      return_delay_time: 0
      angular_resolution: 1.0
      phase: 61                   # 61 = multi-turn (with max/min_pos_limit 0)
      max_pos_limit: 0
      min_pos_limit: 0
      max_load_limit_pct: 20.0
      overload_safe: 15.0
      overload_time_ms: 1000
      overload_thresh: 20.0
      overcurrent: 150
      overcurrent_time_ms: 200
      protection_torque: 20
      overload_protection_time: 200
      enable_protection_overload: 1
      enable_protection_current: 1
      enable_protection_temp: 1
      enable_protection_sensor: 0
      enable_protection_voltage: 0
    motion:
      default:
        accel: 6.0
        vel: 6.0
      fast:
        accel: 6.0
        vel: 6.0
      max:
        accel: 6.0
        vel: 6.0
      slow:
        accel: 4.0
        vel: 1.0
      vel_brakezone_factor: 1
      vel_is_moving_thresh: 0.01
    id: 25                        # Feetech ID on /dev/hello-feetech-wrist
    set_safe_velocity: 1
    req_calibration: 1
    gr: 1.0
    usb_name: /dev/hello-feetech-wrist
    retry_on_comm_failure: 1
    baud: 1000000
    range_pad_deg:
    - 0.0
    - 10.0
    range_deg:
    - 0
    - 187
    homing_offset_bias_t: 0
    homing_to_neg_limit: 1
    homing_pwm: -80               # closing direction; the tendon only pulls closed
    homing_stall_pos_window_t: 60 # ticks/s below which the spool counts as stalled
    flip_encoder_polarity: 1
    stall_backoff: 0.017
    stall_max_effort: 20.0
    stall_max_time: 1.0
    stall_min_vel: 0.1
    disable_torque_on_runstop: 0
    enable_torque_after_runstop: 1
    enable_runstop: 1

ros:
  joints:
  # The tool-agnostic gripper command group: it resolves joint names, units and tolerance
  # through ToolMetadata, so no tool-specific ROS code is needed.
  - py_module_name: stretch_core.command_groups
    py_class_name: GripperCommandGroup

self_collision_mujoco:
  k_brake_distance: {}
  exclusions:
    - ["brd_finger_left_link", "brd_finger_right_link"]
